# Quarkus Configuration for FMT REST API

# HTTP Configuration
quarkus.http.port=8080
quarkus.http.test-port=8081

# Database Configuration
# Profile-based configuration: H2 for dev, Oracle for production

# Development Profile - H2 In-Memory Database
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:fmtdb;DB_CLOSE_DELAY=-1;MODE=Oracle;INIT=CREATE SCHEMA IF NOT EXISTS repo_owner
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.sql-load-script=import-dev.sql
%dev.quarkus.hibernate-orm.jdbc.statement-batch-size=0

# Oracle Test Profile - For local Oracle testing (optional)
# Run with: mvn quarkus:dev -Dquarkus.profile=oracle-test
%oracle-test.quarkus.datasource.db-kind=oracle
%oracle-test.quarkus.datasource.username=${ORACLE_USERNAME:your_username}
%oracle-test.quarkus.datasource.password=${ORACLE_PASSWORD:your_password}
%oracle-test.quarkus.datasource.jdbc.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1521:XE}
%oracle-test.quarkus.hibernate-orm.database.generation=validate
%oracle-test.quarkus.hibernate-orm.log.sql=true

# Production Profile - Oracle Database (credentials from environment)
%prod.quarkus.datasource.db-kind=oracle
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.hibernate-orm.database.generation=none
%prod.quarkus.hibernate-orm.log.sql=false

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."com.lmco.jsf.fmt".level=DEBUG
quarkus.log.console.enable=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# JSON Logging (enabled in production)
quarkus.log.console.json=false
%prod.quarkus.log.console.json=true

# OpenAPI / Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=FMT REST API
mp.openapi.extensions.smallrye.info.version=1.0.0-SNAPSHOT
mp.openapi.extensions.smallrye.info.description=REST API for Fleet Management Tool
mp.openapi.extensions.smallrye.info.contact.name=FMT Team

# Health Checks
quarkus.smallrye-health.root-path=/health

# Metrics
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics

# JWT Configuration
# Disabled in dev mode - enable when JWT authentication is needed
# mp.jwt.verify.publickey.location=classpath:publicKey.pem
# mp.jwt.verify.issuer=https://your-issuer.com
quarkus.smallrye-jwt.enabled=false

# Production JWT Configuration (uncomment and configure when needed)
# %prod.quarkus.smallrye-jwt.enabled=true
# %prod.mp.jwt.verify.publickey.location=classpath:publicKey.pem
# %prod.mp.jwt.verify.issuer=https://your-issuer.com

# CORS Configuration
# Allows browser-based clients to access the API from different origins
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition,X-Total-Count
quarkus.http.cors.access-control-max-age=86400
quarkus.http.cors.access-control-allow-credentials=false

# Production CORS Configuration (restrict origins in production)
# %prod.quarkus.http.cors.origins=https://your-production-domain.com,https://another-allowed-domain.com

# Development Mode Configuration
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.log.console.json=false

# Test Configuration
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;MODE=Oracle;INIT=CREATE SCHEMA IF NOT EXISTS repo_owner
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=import-dev.sql

# API Key Security Configuration
# Server-side secret for HMAC-SHA-256 hashing of API keys
# CRITICAL: This must be changed to a secure random value in production!
# Generate using: openssl rand -base64 32
# Or: python -c "import secrets; print(secrets.token_urlsafe(32))"
apikey.secret=${APIKEY_SECRET:INSECURE_DEFAULT_CHANGE_IN_PRODUCTION_MIN_32_CHARS}
apikey.header-name=X-API-Key
apikey.dev-admin.enabled=false
apikey.dev-admin.header-name=X-Dev-Admin-User
%dev.apikey.dev-admin.enabled=true
%test.apikey.dev-admin.enabled=true
%prod.apikey.dev-admin.enabled=false

# Production: Set via environment variable
# %prod.apikey.secret=${APIKEY_SECRET}
