<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Claim API Key</title>
  <link rel="stylesheet" href="/assets/api-key-ui.css">
</head>
<body>
  <main class="claim-page">
    <section class="claim-card">
      <div class="kicker">Step 1 of 3</div>
      <h1>Claim API Key</h1>
      <p class="subtle">Enter the approved email and one-time claim code provided by your internal contact. This system does not send emails.</p>
      <div class="stepper"><div class="step done"></div><div class="step"></div><div class="step"></div></div>

      <div class="notice warning">This page only allows you to claim a pre-approved key. You cannot request new scopes, create a new client, or change approved access.</div>

      <form method="post" action="/key-claim/ui/review">
        <div class="form-row">
          <label for="approvedEmail">Approved Email / Claim Identifier</label>
          <input id="approvedEmail" name="approvedEmail" autocomplete="username" required>
        </div>

        <div class="form-row">
          <label for="claimCode">One-Time Claim Code</label>
          <input id="claimCode" name="claimCode" autocomplete="off" required>
        </div>

        <div class="actions">
          <button type="submit">Verify Claim</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
